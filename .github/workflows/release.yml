# Copyright (C) 2026 Charles Vestal
# ANATOMIX VOXINATOR's release: built from source on GitHub by the shared FM-1 builder (zvenson/fm1-build@v1), the
# package signed with build provenance (an attestation), so the Firmware Hub shows ANATOMIX VOXINATOR as
# "Built from source on GitHub" and anyone can check that the .fwsc they install is the one this commit builds.
#
# A tag vX.Y is the release: the builder makes the package from that commit, attests it, the release is published with
# the attested package, and the site (.github/workflows/pages.yml) is built from that same package, so the site and the
# Hub serve the same bytes.
#
# Merging to main does not release: .github/workflows/ci.yml builds and tests there. The release's notes are
# docs/hub/notes_vXY.md (v0.1 -> notes_v001.md), if there is one; without it the release keeps GitHub's changelog.
name: Build, attest and release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:                 # a build and an attestation of the selected ref, without a release

permissions:
  contents: read

concurrency:
  group: anatomix-release            # one release at a time, in order: a run is never cancelled halfway
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: The version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version="dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare a draft without replacing a public release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "ANATOMIX VOXINATOR"
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          version=${GITHUB_REF_NAME#v}
          # (the versions base/tools/build.py --release takes)
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" == true ]]; then
              echo "published=false" >> "$GITHUB_OUTPUT"
            else
              # The release is already public. It is not rebuilt: its packages are attested and
              # published, and a fresh build would replace them. The run goes on: the packages are
              # checked again where they are, and the site is built from the published release.
              echo "The release $GITHUB_REF_NAME is already public: it is not rebuilt."
              echo "published=true" >> "$GITHUB_OUTPUT"
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$TITLE $version" --generate-notes "${flags[@]}"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    # The Firmware Hub recognises attestations from this reviewed builder tag.
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        pkg=anatomix
        # the builder checks out without submodules: fm1-base (base/) and its felucca-bsp (base/bsp/), at the commits
        # this one links
        git submodule update --init --recursive
        # the fonts' tabular figures (base/tools/gen_font.py): Pillow's raqm, which loads the system's FriBiDi
        sudo apt-get update -qq
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          ./build.sh --release "$version"
          cp "app/build/$pkg-$version.fwsc" "build/release-assets/"
          # the app on its own, for the people who do not want the package
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-$version-app.bin"
        else
          ./build.sh
          cp "app/build/$pkg.fwsc" "build/release-assets/"
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-app.bin"
        fi
      test: |
        set -euo pipefail
        # the engine's own tests (plain cc, no toolchain): the sound, the maths, the FX
        ./build.sh test
      packages: build/release-assets/*

  verify:
    needs: [prepare, firmware]
    # the packages are the ones of this build, or - when the release is already public and was not
    # rebuilt - the ones that were published with it
    if: always() && needs.prepare.result == 'success' && (needs.firmware.result == 'success' || needs.prepare.outputs.published == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v4

      - name: The packages (from the build of this run)
        if: needs.firmware.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested

      - name: The packages (from the published release)
        if: needs.firmware.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # the same layout the artifact has: the packages under build/release-assets, the checksums
          # at the top (the builder's SHA256SUMS names the packages that way)
          mkdir -p build/attested/build/release-assets
          gh release download "$GITHUB_REF_NAME" --pattern "anatomix-*" --dir build/attested/build/release-assets --clobber
          (cd build/attested && sha256sum build/release-assets/anatomix-* > SHA256SUMS)

      - name: Verify checksums and signed source provenance
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in build/release-assets/*.fwsc build/release-assets/*-app.bin; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done

      - name: Publish the verified release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          # the notes, when they are written: docs/hub/notes_v001.md for v0.1
          dec() { v=$(printf '%s' "$1" | sed 's/^0*//'); if [ -n "$v" ]; then echo "$v"; else echo 0; fi; }
          major="${version%%.*}"; rest="${version#*.}"; minor="${rest%%.*}"; minor="${minor%%-*}"
          notes="docs/hub/notes_v$(printf '%03d' $(( $(dec "$major") * 100 + $(dec "$minor") ))).md"
          args=(--draft=false)
          if [[ -f "$notes" ]]; then
            echo "notes: $notes"
            args+=(--notes-file "$notes")
          else
            echo "no $notes: the release keeps GitHub's changelog"
          fi
          # a release with a suffix in its version is a prerelease and cannot be the latest one
          if [[ "$version" != *-* ]]; then args+=(--latest); fi
          gh release edit "$GITHUB_REF_NAME" "${args[@]}"

  site:
    needs: [prepare, verify]
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.prepare.result == 'success' && needs.verify.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      # the attested package of this build, or - when the release was already public and was not
      # rebuilt - the one that was published with it
      package-from: ${{ needs.prepare.outputs.published == 'true' && 'release' || 'artifact' }}
